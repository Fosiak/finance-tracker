<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tracker</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 8px 32px;">
              <span style="font-size:18px; font-weight:700; color:#111827;">Finance Tracker</span>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px 32px; color:#374151; font-size:15px; line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr>
            <td style="padding:16px 32px; color:#9ca3af; font-size:12px; text-align:center;">
              Finance Tracker &middot; {{ frontend_url }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
